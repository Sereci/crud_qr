<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Operador</title>
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Dashboard Operador</h2>
    <p>Bienvenido, {{ request.user.username }} | <a href="{% url 'logout' %}">Cerrar sesión</a></p>

    <h3>Tareas asignadas</h3>
    <table>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        {% for tarea in tareas %}
        <tr>
            <td>{{ tarea.id }}</td>
            <td>{{ tarea.nombre }}</td>
            <td>{{ tarea.estado }}</td>
            <td>
                <a href="{% url 'cambiar_estado' tarea.id 'en_progreso' %}">En Progreso</a> |
                <a href="{% url 'cambiar_estado' tarea.id 'completado' %}">Completado</a> |
                <a href="{% url 'solicitar_soporte' tarea.id %}">Solicitar Soporte</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No tienes tareas asignadas.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
