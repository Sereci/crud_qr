{% extends "admin/base_site.html" %}
{% block content %}
  <h1>Rutas - {{ oficina.nombre_de_la_oficina }}</h1>
  <table class="adminlist">
    <thead>
      <tr>
        <th>Ticket ID</th>
        <th>Asignado a</th>
      </tr>
    </thead>
    <tbody>
      {% for h in historicos %}
        <tr>
          <td>{{ h.item.ticket_id }}</td>
          <td>{{ h.item.asignado_a }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="2">No hay estaciones (items) registradas para esta oficina.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
